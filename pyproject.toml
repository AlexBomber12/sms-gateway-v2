[build-system]
requires = ["hatchling>=1.24,<2.0"]
build-backend = "hatchling.build"

[project]
name = "sms-gateway-v2"
version = "0.1.0"
description = "Reliable SMS-to-Telegram relay that talks to ModemManager over D-Bus."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aleksei Ratnikov" }]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "structlog>=24.1,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.9,<2.0",
    "httpx>=0.27,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sms_gateway_v2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires real D-Bus or filesystem",
    "e2e: requires real modem and Telegram",
]
addopts = "-m 'not integration and not e2e' --cov=src/sms_gateway_v2 --cov-report=term-missing --cov-fail-under=100"
